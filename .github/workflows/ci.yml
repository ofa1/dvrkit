name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Run unit tests
        run: uv run --python 3.14 --with homeassistant --with numpy --with av --with PyTurboJPEG python -m unittest discover -s tests
      - name: Validate version and package tracked sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor HEAD origin/main
            uv run --python 3.14 python scripts/package_release.py --tag "$REF_NAME"
          else
            uv run --python 3.14 python scripts/package_release.py
          fi
      - name: Save release archive
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dvrkit-integration
          path: dist/dvrkit.zip
          if-no-files-found: error

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          comment: 'false'
          category: integration

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [tests-and-package, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dvrkit-integration
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/dvrkit.zip --verify-tag --generate-notes
